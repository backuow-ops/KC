<!DOCTYPE html>
<html lang="hi">
<head>

<style>

:root[data-theme="dark"]{--bg:#1b1610;--fg:#f8ecd9;--card:rgba(40,31,22,.93);--accent:#ffa940;--line:rgba(248,236,217,.22);--veil:rgba(27,22,16,.7)}

h1{font-size:clamp(40px,10vw,64px);font-weight:400;margin:0 0 4px;line-height:1.1;text-shadow:0 1px 14px var(--bg)}
.sub{font-style:italic;font-size:20px;margin:0 0 16px;text-shadow:0 1px 10px var(--bg)}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:19px;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px}

button.main{background:var(--accent);color:#fff;border-color:transparent;font-size:21px;padding:11px 24px}

#top small{font-size:17px;opacity:.85;display:block}#top b{font-weight:400;font-size:28px}

#mt{text-align:center;font-size:18px;line-height:1.4}

</style>
</head>

function wire(c){

else if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed'){if(tries<10){net.rt=setTimeout(function(){if(myRole===role)netStart(role,tries+1)},5000)}else setStat('internet/online server problem')}})}

if(mv){var gl=Math.max(Math.hypot(fx,fy),1),gx=fx/gl,gy=fy/gl,dx=Math.cos(yaw)*gx-Math.sin(yaw)*gy,dz=-Math.sin(yaw)*gx-Math.cos(yaw)*gy;
hdm=Math.atan2(dx,dz);tsp=(keys.shift||mag>.9)?4.4:1.9*Math.min(1,mag/.6)}
drive(me,tsp,hdm,dt,9);
if(uu.speed>.02){var nx=me.position.x+Math.sin(uu.heading)*uu.speed*dt,nz=me.position.z+Math.cos(uu.heading)*uu.speed*dt;
doors.forEach(function(w){if(Math.abs(nz-w)<.45&&Math.abs(nx)>1.1)nz=me.position.z});

if(pd>lim){hs=Math.min(4.4,Math.max(1.3,(pd-lim)*2.4+1.2));hh=Math.atan2(px,pz)}else if(za===zb)hh=Math.atan2(me.position.x-her.position.x,me.position.z-her.position.z);
drive(her,hs,hh,dt,pd>lim?9:3);

anim(me,dt,t);anim(her,dt,t);
// zone label + shayari

// camera

else{var d=sitting?4.4:4.8,hh=sitting?2.3:2.6,cx=me.position.x+(sitting?.45:0)+Math.sin(yaw)*d,cz=me.position.z+Math.cos(yaw)*d;
